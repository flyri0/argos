name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Runs gofmt/vet/test natively on each OS, since several packages
  # (internal/tray's autostart, internal/service's systemd/launchd/Windows
  # Service backends) are gated by //go:build tags and only actually
  # compile+execute on their own OS.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt check
        if: runner.os != 'Windows'
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt'd:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  # Type-checks and unit-tests the PWA frontend (web/). A single ubuntu run
  # is enough here — unlike the Go service/tray code, nothing under web/ is
  # platform-gated.
  web-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  # Cross-compiles the argos binary for every platform §3.1/§3.2 target.
  # linux/windows need no CGO (fyne.io/systray's backends for both are
  # pure Go), so they're cross-compiled from ubuntu-latest; darwin needs
  # CGO (Cocoa has no pure-Go binding) and so must build natively on a
  # real macOS runner. Only the Apple Silicon (M1+) runner is used here —
  # the Intel macOS runners (macos-*-large) are billed even for public
  # repos, unlike the standard arm64 macos-latest runner.
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-latest
            goos: linux
            goarch: amd64
            cgo: "0"
          - name: windows-amd64
            os: ubuntu-latest
            goos: windows
            goarch: amd64
            cgo: "0"
          - name: darwin-arm64
            os: macos-latest
            goos: darwin
            goarch: arm64
            cgo: "1"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # §2.1: go build alone would embed only the committed placeholder
      # (internal/webui/dist/index.html) — the real frontend has to be
      # built first so these release binaries embed the actual app.
      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          mkdir -p dist
          out="dist/argos-${{ matrix.name }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then out="$out.exe"; fi
          go build -o "$out" ./cmd/argos

      - uses: actions/upload-artifact@v4
        with:
          name: argos-${{ matrix.name }}
          path: dist/
